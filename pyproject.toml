[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "admit"
version = "0.1.0"
description = "ADMIT: conformal cell typing over a cell-type hierarchy whose prediction target depends on the measured marker panel"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
demo = ["scikit-learn>=1.3"]
test = ["pytest>=7", "scikit-learn>=1.3"]
experiments = [
    "pandas>=2.0", "pyarrow>=14", "scipy>=1.10", "scikit-learn>=1.3", "xgboost>=2.0", "torch>=2.0",
    "lifelines>=0.27", "statsmodels>=0.14", "joblib>=1.3",
    "matplotlib>=3.8", "tifffile", "scikit-image",   # case studies (experiments/case_studies)
]
figures = ["matplotlib>=3.8", "pandas>=2.0", "pyarrow>=14", "scipy>=1.10", "tifffile", "scikit-image", "pillow"]

[tool.setuptools]
packages = ["admit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
